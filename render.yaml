# Render Blueprint for the NestJS API (https://render.com/docs/blueprint-spec).
# Render reads this file when the repo is connected as a Blueprint, so the service's
# settings live in the repo instead of only in a dashboard.
services:
  - type: web
    name: fernleaf-api
    runtime: node
    # Closest Render region to India, and the same region as the Supabase database.
    region: singapore
    plan: free
    # --include=dev: the build needs TypeScript, the Nest CLI, Prisma and Turborepo.
    # Turborepo builds the shared package and generates the Prisma client first.
    # No migration step: database changes are applied by hand in Supabase (see README).
    buildCommand: npm ci --include=dev && npx turbo run build --filter=@fernleaf/api
    startCommand: npm run start:prod -w @fernleaf/api
    healthCheckPath: /api/health
    # Only redeploy the API when API code (or what it depends on) changes.
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: KITCHEN_TIME_ZONE
        value: Asia/Kolkata
      - key: SESSION_TTL_HOURS
        value: '12'
      # Generated by Render once, never stored in the repo.
      - key: JWT_SECRET
        generateValue: true
      # Supabase "Session pooler" connection string - entered by hand in the Render dashboard.
      - key: DATABASE_URL
        sync: false
