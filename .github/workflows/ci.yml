name: CI

# Every push to main and every pull request must format, lint, type-check, test and build.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint, type-check, unit tests, build
        run: npx turbo run lint typecheck test build

      # Starts a throwaway PostgreSQL, applies the migration SQL files and runs the
      # API end to end (sign-in, permissions, ...). No secrets or external database needed.
      - name: API end-to-end tests
        run: npm run test:e2e -w @fernleaf/api
